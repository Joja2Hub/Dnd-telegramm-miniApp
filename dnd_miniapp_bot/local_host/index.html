<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1017">
  <meta name="color-scheme" content="dark">
  <title>DND Local Host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23161d27'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/local/styles.css?v=local-20260808">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">ЛОКАЛЬНАЯ ИГРА</p>
        <h1>DND Mini App</h1>
        <p class="lead">Выберите персонажа и продолжайте игру с телефона.</p>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" title="Обновить список" aria-label="Обновить список">↻</button>
    </section>

    <section class="panel player-panel">
      <div class="section-head">
        <div>
          <p class="section-kicker">АКТИВНАЯ КАМПАНИЯ</p>
          <h2>Войти в игру</h2>
        </div>
      </div>
      <div id="activeBox" class="active-box"></div>
      <div id="characterBox" class="character-box"></div>
    </section>

    <details class="panel host-tools">
      <summary><span><b>Инструменты мастера</b><small>сменить кампанию или открыть панель мастера</small></span></summary>
      <div class="host-tools-body">
        <div class="host-campaign-block">
          <label for="campaignSelect">Кампания для этого стола</label>
          <div class="campaign-row">
            <select id="campaignSelect"></select>
            <button id="activateBtn" type="button">Сделать активной</button>
          </div>
        </div>
        <div id="hostLoginBox" class="login-box"></div>
      </div>
    </details>
  </main>

  <script defer src="/local/app.js?v=local-20260808"></script>
</body>
</html>

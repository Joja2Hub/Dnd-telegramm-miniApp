<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1017">
  <meta name="color-scheme" content="dark">
  <title>DND Local Host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23161d27'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/local/styles.css?v=local-20260815-player-address">
  <link rel="stylesheet" href="/local/hub.css?v=2">
  <link rel="stylesheet" href="/local/profile.css?v=4">
</head>
<body>
  <main class="shell">
    <header class="local-login-bar"><h1>DND Mini App</h1><details class="login-menu"><summary>Войти</summary><div id="localLoginMenu" class="login-users"><p>Загрузка пользователей...</p></div></details></header>
    <section class="local-login-welcome"><h2>Твои истории. Твои персонажи.</h2><p>Профили игроков, коллекции достижений и игры.</p><div id="loginStatus" role="status"></div></section>
    <section class="hero" hidden>
      <div>
        <p class="eyebrow">ЛОКАЛЬНАЯ ИГРА</p>
        <h1>DND Mini App</h1>
        <p class="lead">Персонажи, достижения и игры</p>
      </div>
      <span class="hero-actions">
        <button id="createGameShortcut" class="secondary quick-create-btn" type="button">＋ Новая игра</button>
        <button id="refreshBtn" class="icon-btn" type="button" title="Обновить список" aria-label="Обновить список">↻</button>
      </span>
    </section>

    <section class="panel player-panel">
      <div class="section-head">
        <div>
          <p class="section-kicker">АКТИВНАЯ КАМПАНИЯ</p>
          <h2>Выбор пользователя</h2>
        </div>
      </div>
      <div id="activeBox" class="active-box"></div>
      <div id="characterBox" class="character-box"></div>
    </section>

    <details class="panel host-tools" hidden>
      <summary><span><b>Инструменты мастера</b><small>сменить кампанию или открыть панель мастера</small></span></summary>
      <div class="host-tools-body">
        <div class="host-campaign-block">
          <label for="campaignSelect">Кампания для этого стола</label>
          <div class="campaign-row">
            <select id="campaignSelect"></select>
            <button id="activateBtn" type="button">Сделать активной</button>
          </div>
        </div>
        <div id="hostCreateBox"></div>
        <div id="hostLoginBox" class="login-box"></div>
      </div>
    </details>
  </main>

  <script defer src="/local/app.js?v=profile-20261028-v3"></script>
</body>
</html>

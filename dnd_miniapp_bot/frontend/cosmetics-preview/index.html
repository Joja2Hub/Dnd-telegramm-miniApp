<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c10">
  <title>FX Lab — эффекты персонажей</title>
  <link rel="stylesheet" href="./styles.css?v=11">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-sigil" aria-hidden="true"><i></i><i></i></div>
      <div>
        <p>FX LAB · СТИХИИ И МАГИЯ</p>
        <h1>Эффекты персонажей</h1>
      </div>
    </div>
    <div class="build-facts" aria-label="Параметры прототипа">
      <div><b id="effect-total">28</b><span>эффектов</span></div>
      <div><b>8</b><span>категорий</span></div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Управление каталогом">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" placeholder="Название, класс или стихия">
      </label>

      <label class="field-control">
        <span>Портрет</span>
        <select id="avatar-select" aria-label="Портрет для проверки">
          <option value="fantasy">Фэнтези</option>
          <option value="mystic">Мистика</option>
          <option value="cyber">Киберпанк</option>
        </select>
      </label>

      <label class="field-control">
        <span>Размер</span>
        <select id="size-select" aria-label="Игровой размер аватара">
          <option value="48">48 px</option>
          <option value="64" selected>64 px</option>
          <option value="80">80 px</option>
        </select>
      </label>

      <label class="field-control">
        <span>Фон</span>
        <select id="backdrop-select" aria-label="Фон проверки">
          <option value="ink">Чернильный</option>
          <option value="stone">Светлый камень</option>
          <option value="ember">Тёплый</option>
        </select>
      </label>

      <button id="motion-toggle" class="motion-button" type="button" aria-pressed="false" title="Приостановить анимацию">
        <i aria-hidden="true">Ⅱ</i><span>Движение</span>
      </button>
    </section>

    <nav id="category-bar" class="category-bar" aria-label="Категории эффектов"></nav>

    <section class="catalog-section">
      <div class="section-head">
        <div>
          <p>КОЛЛЕКЦИЯ ЭФФЕКТОВ</p>
          <h2>Библиотека</h2>
        </div>
        <span id="result-count"></span>
      </div>
      <div id="effect-grid" class="effect-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <b>Ничего не найдено</b>
        <span>Измените запрос или категорию.</span>
      </div>
    </section>
  </main>

  <dialog id="effect-dialog" class="effect-dialog">
    <div class="dialog-dismiss">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="Закрыть" title="Закрыть">×</button>
    </div>
    <div class="dialog-layout">
      <div id="dialog-stage" class="dialog-stage" data-backdrop="ink"></div>
      <div class="dialog-copy">
        <p id="dialog-kicker"></p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <div class="dialog-specs">
          <div><span>Композиция</span><b id="dialog-layout-name"></b></div>
          <div><span>Цикл</span><b id="dialog-loop"></b></div>
        </div>
        <div id="dialog-tags" class="tag-row"></div>
        <div id="effect-color-controls" class="smoke-controls">
          <label for="effect-color-mode"><span>Окраска</span></label>
          <select id="effect-color-mode" aria-label="Режим окраски">
            <option value="original">Исходная палитра</option>
            <option value="solid">Один цвет</option>
            <option value="gradient">Градиент</option>
          </select>
          <div id="effect-palettes" class="smoke-palettes" role="group" aria-label="Палитры эффекта"></div>
          <div id="effect-colors" class="smoke-colors">
            <label><span>Цвет 1</span><input type="color" aria-label="Цвет эффекта 1" value="#8fffe0"></label>
            <label><span>Цвет 2</span><input type="color" aria-label="Цвет эффекта 2" value="#439b9d"></label>
            <label><span>Цвет 3</span><input type="color" aria-label="Цвет эффекта 3" value="#eafff3"></label>
          </div>
          <div id="effect-angle-control">
            <label for="effect-gradient-angle"><span>Направление</span><output id="effect-angle-value">45°</output></label>
            <input id="effect-gradient-angle" type="range" min="0" max="360" step="5" value="45" aria-label="Направление градиента">
          </div>
          <div id="star-color-control" hidden>
            <label class="star-color-toggle"><span>Отдельный цвет звезды</span><input id="star-color-enabled" type="checkbox"></label>
            <input id="star-color" type="color" aria-label="Цвет пентаграммы" value="#8fffe0" hidden>
          </div>
          <button id="effect-color-reset" type="button" class="color-reset" title="Сбросить цвета">Сбросить цвета</button>
        </div>
        <div id="smoke-controls" class="smoke-controls" hidden>
          <span class="palette-label">Градиент</span>
          <div id="smoke-palettes" class="smoke-palettes" role="group" aria-label="Градиент дыма"></div>
          <div id="smoke-colors" class="smoke-colors">
            <label><span>Начало</span><input type="color" value="#9157d8" aria-label="Начальный цвет дыма" title="Начальный цвет дыма"></label>
            <label><span>Середина</span><input type="color" value="#57b5de" aria-label="Средний цвет дыма" title="Средний цвет дыма"></label>
            <label><span>Конец</span><input type="color" value="#e993c4" aria-label="Конечный цвет дыма" title="Конечный цвет дыма"></label>
          </div>
          <label for="smoke-density"><span>Плотность</span><output id="density-value">100%</output></label>
          <input id="smoke-density" type="range" min="40" max="180" value="100" step="5" aria-label="Плотность">
          <label for="smoke-speed"><span>Скорость</span><output id="speed-value">100%</output></label>
          <input id="smoke-speed" type="range" min="30" max="180" value="100" step="5" aria-label="Скорость">
        </div>
        <div class="dialog-navigation">
          <button id="dialog-previous" type="button" aria-label="Предыдущий эффект" title="Предыдущий эффект">←</button>
          <span id="dialog-position"></span>
          <button id="dialog-next" type="button" aria-label="Следующий эффект" title="Следующий эффект">→</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="./smoke-effects.js?v=5"></script>
  <script src="./arcane-effects.js?v=21"></script>
  <script src="../effect-renderer.js?v=4"></script>
  <script src="./app.js?v=52"></script>
</body>
</html>
